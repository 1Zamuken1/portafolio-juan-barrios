name: CI

on:
  push:
    branches: [develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [master, develop]

# Una tanda por rama: un push nuevo cancela la anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El build genera el HTML prerenderizado que valida e2e/prerender.spec.ts.
      - name: Compilar
        run: pnpm run build

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests end-to-end
        run: pnpm run e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # El pom fija java.version 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Permisos del wrapper
        run: chmod +x ./mvnw

      - name: Tests
        run: ./mvnw --batch-mode --no-transfer-progress test
