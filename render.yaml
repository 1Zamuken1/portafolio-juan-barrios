services:
  - type: web
    name: portafolio-backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_OPTS
        value: -Xms256m -Xmx384m
      - key: DATABASE_URL
        fromDatabase:
          name: portafolio-db
          property: connectionString
    healthCheckPath: /api/projects

  - type: postgres
    name: portafolio-db
    plan: free
    databaseName: portafolio
    ipAllowList: []