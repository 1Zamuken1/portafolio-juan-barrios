services:
  - type: web
    name: portafolio-backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_OPTS
        value: -Xms256m -Xmx384m
      - key: DATABASE_URL
        fromDatabase:
          name: portafolio-db
          property: connectionString
      # Secretos: se definen manualmente en el dashboard de Render.
      # JWT_SECRET debe ser BASE64 de 256 bits o mas:
      #   openssl rand -base64 32
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    healthCheckPath: /api/projects

  - type: postgres
    name: portafolio-db
    plan: free
    databaseName: portafolio
    ipAllowList: []
