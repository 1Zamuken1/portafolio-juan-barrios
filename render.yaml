services:
  - type: web
    name: portafolio-backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_OPTS
        value: -Xms256m -Xmx384m
      # La base de datos es externa (Neon o Supabase). Las gratuitas de Render
      # se eliminan a los 30 dias: la anterior desaparecio con todo su
      # contenido y el backend llevaba semanas sin arrancar por eso.
      # Todas estas se definen a mano en el dashboard.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Secretos: JWT_SECRET debe ser BASE64 de 256 bits o mas:
      #   openssl rand -base64 32
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # La ruta de salud NO debe tocar la base de datos: si una tabla queda rota,
    # la comprobacion falla, Render no promueve el despliegue y el arreglo que
    # repararia esa tabla no llega a entrar nunca. Paso de verdad.
    healthCheckPath: /api/health
