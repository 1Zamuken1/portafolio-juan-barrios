       peticion menos, y el optimizador de CSS critico deja de avisar de que no
       encuentra esa hoja.

       Antes eran hojas externas --Google Fonts, dos CDN de iconos-- y la fuente
       completa de devicon: 777 kB por visita, el 70% del peso de la portada,
       para unas decenas de iconos. Tambien se acabo el devicon@latest sin
       fijar: cualquier cambio que publicaran entraba en el sitio sin tocar
       nada aqui.

       Ninguna fuente se precarga. Con la de iconos se probo y costaba 60 ms de
       First Contentful Paint: un preload es de prioridad alta y compite con el
       CSS y el JS criticos. Con Inter se volvio a probar y el ruido de la
       medicion (el mismo build, entre 750 y 2100 ms de FCP) era mayor que
       cualquier diferencia; y con font-display: swap el texto se pinta al
       momento con la fuente de respaldo, asi que no hay nada que adelantar. -->
