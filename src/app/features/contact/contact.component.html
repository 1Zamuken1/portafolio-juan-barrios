<div class="editor-canvas">
  <div class="glass-card flex-1 overflow-y-auto" style="border:none; background: transparent; box-shadow: none;">
    <div class="code-editor-layout markdown-body" style="padding: 2.5rem 3rem;">
      <h1 class="md-h1"># Ponerse en Contacto</h1>
      <p class="md-p subtitle">¿Interesado en trabajar juntos? Me pondré en contacto contigo lo antes posible.</p>

      <div class="contact-links-inline">
        <a href="mailto:j.barriosgaviria@gmail.com" class="contact-link">
          <i class="pi pi-envelope"></i>
          <span>j.barriosgaviria@gmail.com</span>
        </a>
        <a href="https://github.com/1Zamuken1" target="_blank" class="contact-link">
          <i class="pi pi-github"></i>
          <span>1Zamuken1</span>
        </a>
        <a href="https://www.linkedin.com/in/juan-barrios-409605335/" target="_blank" class="contact-link">
          <i class="pi pi-linkedin"></i>
          <span>LinkedIn</span>
        </a>
      </div>

      <h2 class="md-h2">## Enviar Mensaje Directo</h2>
      
      <p-toast />
      
      <form [formGroup]="contactForm" (ngSubmit)="sendContactForm()" class="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" type="text" formControlName="name" placeholder="Tu nombre" />
          <p-message *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" severity="error" text="Requerido" styleClass="inline-error" />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="tu@email.com" />
          <p-message *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" severity="error" text="Requerido" styleClass="inline-error" />
        </div>

        <div class="form-group">
          <label for="subject">Asunto</label>
          <input id="subject" type="text" formControlName="subject" placeholder="Asunto del mensaje" />
          <p-message *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched" severity="error" text="Requerido" styleClass="inline-error" />
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" formControlName="message" placeholder="Cuéntame en qué puedo ayudarte..." rows="4"></textarea>
          <p-message *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" severity="error" text="Requerido" styleClass="inline-error" />
        </div>

        <button type="submit" [disabled]="submitting()">
          <i class="pi" [ngClass]="submitting() ? 'pi-spin pi-spinner' : 'pi-send'"></i>
          <span>{{ submitting() ? 'Enviando...' : 'Enviar Mensaje' }}</span>
        </button>
        
        <span *ngIf="submitError()" class="form-feedback error-text">Error: {{ submitError() }}</span>
        <span *ngIf="submitted()" class="form-feedback success-text">¡Mensaje enviado correctamente!</span>
      </form>
    </div>
  </div>
</div>
