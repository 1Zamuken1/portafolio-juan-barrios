<div class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="marca">
        <i class="pi pi-code" aria-hidden="true"></i>
        <span>Panel</span>
      </span>
      <span class="marca-sub">portafolio-juan-barrios</span>
    </div>

    <nav class="sidebar-nav" aria-label="Secciones del panel">
      <span class="nav-grupo">Contenido</span>
      <a class="nav-link" routerLink="projects" routerLinkActive="active">
        <i class="pi pi-folder" aria-hidden="true"></i> Proyectos
      </a>
      <a class="nav-link" routerLink="experience" routerLinkActive="active">
        <i class="pi pi-calendar" aria-hidden="true"></i> Trayectoria
      </a>
      <a class="nav-link" routerLink="skills" routerLinkActive="active">
        <i class="pi pi-database" aria-hidden="true"></i> Stack
      </a>
    </nav>

    <div class="sidebar-footer">
      <!-- Recordatorio de que guardar aqui no publica nada: el sitio lee los
           JSON del repositorio, no la base de datos. Se ha olvidado alguna vez. -->
      <p class="aviso-publicar">
        <i class="pi pi-info-circle" aria-hidden="true"></i>
        Guardar cambia la base, no el sitio. Para publicar:
        <code>pnpm run mirror:publish</code>
      </p>

      <!-- El tema, con las dos opciones a la vista. Un solo icono que cambia
           dice lo que va a pasar, no lo que hay: aqui se ve de un vistazo en
           cual estas. Lo guarda ThemeService, el mismo que usa el sitio. -->
      <div class="tema" role="radiogroup" aria-label="Tema del panel"
           [attr.data-tema]="tema.theme()">
        <span class="tema__deslizador" aria-hidden="true"></span>
        <button type="button" role="radio" class="tema__opcion"
                [attr.aria-checked]="tema.isDark()" (click)="tema.theme.set('dark')">
          <i class="pi pi-moon" aria-hidden="true"></i> Oscuro
        </button>
        <button type="button" role="radio" class="tema__opcion"
                [attr.aria-checked]="!tema.isDark()" (click)="tema.theme.set('light')">
          <i class="pi pi-sun" aria-hidden="true"></i> Claro
        </button>
      </div>

      <a routerLink="/" class="nav-link">
        <i class="pi pi-external-link" aria-hidden="true"></i> Ver el portafolio
      </a>
      <button (click)="logout()" class="logout-btn">
        <i class="pi pi-sign-out" aria-hidden="true"></i> Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="dashboard-content">
    <router-outlet></router-outlet>
  </main>
</div>
