<div class="login admin-app">
  <div class="tarjeta-login">
    <div class="login__marca" aria-hidden="true"><i class="pi pi-code"></i></div>
    <h1 class="login__titulo">Panel</h1>
    <p class="login__lema">portafolio-juan-barrios</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login__formulario">
      <p-floatlabel variant="in">
        <input pInputText id="username" formControlName="username" autocomplete="username" />
        <label for="username">Usuario</label>
      </p-floatlabel>

      <p-floatlabel variant="in">
        <p-password inputId="password" formControlName="password" [feedback]="false"
                    [toggleMask]="true" autocomplete="current-password" />
        <label for="password">Contraseña</label>
      </p-floatlabel>

      @if (error()) {
        <p class="login__error" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i> {{ error() }}
        </p>
      }

      <p-button type="submit" label="Entrar" styleClass="login__entrar"
                [loading]="loading()" [disabled]="loginForm.invalid" />
    </form>

    <p-button label="Volver al portafolio" icon="pi pi-arrow-left" [text]="true"
              styleClass="login__volver" (onClick)="volver()" />
  </div>
</div>
