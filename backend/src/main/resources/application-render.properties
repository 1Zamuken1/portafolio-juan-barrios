server.port=${PORT:8080}

# Base de datos externa (Neon o Supabase). Se define con las tres variables
# SPRING_DATASOURCE_* en el dashboard; no hay valor por defecto a proposito,
# para que un despliegue mal configurado falle en vez de apuntar a la base
# SQLite de desarrollo.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate elige el dialecto solo; declararlo dispara HHH90000025.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.default-property-inclusion=non_null