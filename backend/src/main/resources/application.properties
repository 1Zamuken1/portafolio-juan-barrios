# ========================================
# Portfolio Backend - Development Config
# ========================================

server.port=8080

# SQLite Database (Development)
spring.datasource.url=jdbc:sqlite:portfolio.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
# El dialecto de SQLite es de la comunidad y Hibernate no lo autodetecta,
# asi que hay que declararlo. CUIDADO: los perfiles heredan de este fichero.
# Todo perfil que use otro motor DEBE anular esta linea o generara DDL de
# SQLite contra la base equivocada. Lo vigila DialectoNoFijadoTest.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Jackson serialization
spring.jackson.default-property-inclusion=non_null

# JWT Security
# JWT_SECRET debe ser una clave BASE64 de al menos 256 bits. Sin valor por
# defecto: la aplicacion no arranca si no esta definida (fail-fast intencional).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin Credentials
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Redactor de borradores (Groq)
# Sin GROQ_API_KEY la aplicacion arranca igual y solo deja de funcionar el
# boton de redactar. Es distinto de jwt.secret a proposito: sin JWT no hay
# panel, pero sin esta clave el portafolio entero sigue en pie.
groq.api-key=${GROQ_API_KEY:}
# Lista en orden de preferencia. Groq retira modelos cada pocos meses; con
# uno solo, el dia que caiga el boton deja de funcionar hasta que alguien se
# entere. Con una lista se pasa al siguiente y sigue en pie.
groq.model=${GROQ_MODEL:openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.6-27b}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}

# Plazo de las respuestas en streaming (el redactor). Sin fijarlo, Spring usa
# el del contenedor, unos 30 s: una redaccion con reintento pasa de eso, y al
# vencer el plazo Spring intentaba pintar una pagina de error sobre una
# respuesta que ya habia empezado a salir ("Cannot render error page ... the
# response has already been committed"). El panel veia la conexion cortada.
spring.mvc.async.request-timeout=180s
